<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle Grid -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Terminal / Agent Window Card -->
  <rect x="70" y="45" width="660" height="360" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="70" y="45" width="660" height="42" rx="14" fill="#1e293b"/>
  <rect x="70" y="73" width="660" height="14" fill="#1e293b"/>

  <!-- Window Controls -->
  <circle cx="98" cy="66" r="6" fill="#ef4444"/>
  <circle cx="118" cy="66" r="6" fill="#f59e0b"/>
  <circle cx="138" cy="66" r="6" fill="#10b981"/>

  <text x="400" y="71" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="15" font-weight="bold" letter-spacing="1.5">
    AEGIS :: AUTONOMOUS OS INTELLIGENCE AGENT
  </text>

  <!-- Pipeline Diagram -->
  <g transform="translate(105, 115)">
    <!-- Node 1: NL Prompt -->
    <rect x="0" y="0" width="155" height="68" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="77" y="28" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="bold">NATURAL LANGUAGE</text>
    <text x="77" y="48" text-anchor="middle" fill="#e0e7ff" font-family="monospace" font-size="11">Voice / Chat Input</text>

    <!-- Arrow 1 -->
    <line x1="155" y1="34" x2="210" y2="34" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
    <polygon points="210,29 220,34 210,39" fill="#22d3ee"/>

    <!-- Node 2: Local LLM Planner -->
    <rect x="220" y="0" width="155" height="68" rx="8" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="297" y="28" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="bold">LOCAL LLM PLANNER</text>
    <text x="297" y="48" text-anchor="middle" fill="#cffafe" font-family="monospace" font-size="11">100% Offline JSON</text>

    <!-- Arrow 2 -->
    <line x1="375" y1="34" x2="430" y2="34" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <polygon points="430,29 440,34 430,39" fill="#10b981"/>

    <!-- Node 3: Policy & 100+ Tools -->
    <rect x="440" y="0" width="155" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="517" y="28" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="bold">POLICY ENGINE</text>
    <text x="517" y="48" text-anchor="middle" fill="#d1fae5" font-family="monospace" font-size="11">100+ OS Tools</text>
  </g>

  <!-- Console Output Simulation -->
  <rect x="105" y="210" width="590" height="145" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="125" y="238" fill="#22d3ee" font-family="monospace" font-size="13">&gt; aegis "Find large PDFs from last week, summarize &amp; encrypt"</text>
  <text x="125" y="264" fill="#a5b4fc" font-family="monospace" font-size="12">[PLAN] 1. fts5_search(ext="pdf")  2. doc_summarize()  3. aes256_encrypt()</text>
  <text x="125" y="290" fill="#34d399" font-family="monospace" font-size="12">[POLICY] Path &amp; permission check passed (offline sandbox)</text>
  <text x="125" y="316" fill="#f8fafc" font-family="monospace" font-size="12">[EXEC] Completed 3/3 steps in 1.4s | Whisper TTS Ready</text>
  <text x="125" y="340" fill="#94a3b8" font-family="monospace" font-size="11">FastAPI · Alpine.js · xterm.js · SQLite FTS5 · Ollama / LM Studio</text>

  <!-- Bottom Status Bar -->
  <rect x="105" y="368" width="590" height="6" rx="3" fill="url(#accent)"/>
</svg>
