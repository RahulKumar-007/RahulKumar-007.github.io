<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Portfolio</title>
    <meta name="description" content="A minimal OS-style portfolio website.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
</head>

<body>
    <div id="desktop">
        <!-- Background Wallpaper -->
        <div class="wallpaper"></div>

        <!-- Top Menu Bar -->
        <header id="menu-bar">
            <div class="left-menu">
                <span class="apple-logo"><i class="ph-fill ph-apple-logo"></i></span>
                <span class="menu-item"><b>Finder</b></span>
                <span class="menu-item">File</span>
                <span class="menu-item">Edit</span>
                <span class="menu-item">View</span>
                <span class="menu-item">Go</span>
                <span class="menu-item">Window</span>
                <span class="menu-item">Help</span>
            </div>
            <div class="right-menu">
                <span class="menu-icon"><i class="ph ph-wifi-high"></i></span>
                <span class="menu-icon"><i class="ph ph-battery-charging"></i></span>
                <span id="clock" class="clock">12:00 PM</span>
            </div>
        </header>

        <!-- Main Window Area -->
        <main id="window-area">
            <!-- Desktop Icons -->
            <div class="desktop-icons">
                <!-- Icons will be injected here or hardcoded -->
                <div class="desktop-icon" data-target="about">
                    <div class="icon-img folder-icon"><i class="ph-fill ph-folder-user"></i></div>
                    <span class="icon-label">About Me</span>
                </div>
                <div class="desktop-icon" data-target="projects">
                    <div class="icon-img folder-icon"><i class="ph-fill ph-folder-star"></i></div>
                    <span class="icon-label">Projects</span>
                </div>
            </div>
        </main>

        <!-- Bottom Dock -->
        <footer id="dock-container">
            <div id="dock" class="dock">
                <!-- Dock items will be injected by JS or hardcoded -->
                <div class="dock-item" data-app="finder" title="Finder">
                    <div class="app-icon"><i class="ph-fill ph-smiley"></i></div>
                </div>
                <div class="dock-item" data-app="mail" title="Mail">
                    <div class="app-icon"><i class="ph-fill ph-envelope"></i></div>
                </div>
                <div class="dock-item" data-app="safari" title="Browser">
                    <div class="app-icon"><i class="ph-fill ph-compass"></i></div>
                </div>
                <div class="dock-separator"></div>
                <div class="dock-item" data-app="terminal" title="Terminal">
                    <div class="app-icon"><i class="ph-fill ph-terminal-window"></i></div>
                </div>
                <div class="dock-item" data-app="trash" title="Trash">
                    <div class="app-icon"><i class="ph-fill ph-trash"></i></div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
