<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Kumar - Interactive Portfolio</title>
    <meta name="description" content="Explore my portfolio in an interactive 2D world.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles/game.css">
</head>
<body>
    <!-- Game Viewport -->
    <div id="viewport">
        <!-- The World -->
        <div id="world">
            <!-- Ground patterns and paths will be injected here -->
            <div id="ground-layer"></div>
            
            <!-- Interactables, Scenery, and Zones -->
            <div id="object-layer"></div>
        </div>

        <!-- The Player (Fixed in center of viewport) -->
        <div id="player">
            <div class="player-sprite">
                <div class="player-head"></div>
                <div class="player-body"></div>
                <div class="player-shadow"></div>
            </div>
            <div id="interaction-prompt" class="hidden">
                <span class="key">E</span> Interact
            </div>
        </div>
        
        <!-- UI Layer (Overlays, Dialogues, Modals) -->
        <div id="ui-layer">
            <div id="intro-screen">
                <div class="intro-card">
                    <h1>Welcome to my World.</h1>
                    <p>Use <strong>W A S D</strong> or <strong>Arrow Keys</strong> to move.<br>Press <strong>E</strong> to interact with objects.</p>
                    <button id="start-btn">Start Exploring</button>
                </div>
            </div>

            <!-- Generic Dialog Box -->
            <div id="dialog-box" class="hidden">
                <button class="close-btn"><i class="ph ph-x"></i></button>
                <div id="dialog-content"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/game/main.js"></script>
</body>
</html>
